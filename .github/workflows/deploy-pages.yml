name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Loaf market snapshot
        run: |
          mkdir -p public
          curl --fail --silent --show-error --retry 3 \
            --header 'Accept: application/json' \
            'https://api.loafmarkets.com/api/trade' \
            --output public/markets.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('public/markets.json','utf8')); if(!Array.isArray(d.properties)) throw new Error('Unexpected Loaf API response'); console.log('Synced markets:', d.properties.length)"

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
