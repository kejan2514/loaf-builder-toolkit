name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Loaf market snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          is_valid_snapshot() {
            node -e "const fs=require('fs'); const p=process.argv[1]; const raw=fs.readFileSync(p,'utf8').trim(); if(!raw) process.exit(1); const d=JSON.parse(raw); if(!Array.isArray(d.properties)) process.exit(1); console.log('Validated markets:', d.properties.length)" "$1"
          }

          fresh_file="$(mktemp)"
          fallback_file="$(mktemp)"
          trap 'rm -f "$fresh_file" "$fallback_file"' EXIT

          if curl --fail --silent --show-error \
            --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            --header 'Accept: application/json' \
            'https://api.loafmarkets.com/api/trade' \
            --output "$fresh_file" \
            && is_valid_snapshot "$fresh_file"; then
            mv "$fresh_file" public/markets.json
            echo 'Fetched and validated fresh Loaf market snapshot.'
          else
            echo 'Fresh Loaf API response was unavailable or invalid; attempting last deployed snapshot.'
            if curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              'https://kejan2514.github.io/loaf-builder-toolkit/markets.json' \
              --output "$fallback_file" \
              && is_valid_snapshot "$fallback_file"; then
              mv "$fallback_file" public/markets.json
              echo 'Reused last valid deployed snapshot.'
            else
              echo 'No valid remote snapshot available; using an empty safe snapshot so Pages can still deploy.'
              printf '%s\n' '{"properties":[]}' > public/markets.json
            fi
          fi

          is_valid_snapshot public/markets.json

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
