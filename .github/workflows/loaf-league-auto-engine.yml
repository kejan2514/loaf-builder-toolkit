name: Loaf League Bot - Auto Competition Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: loaf-league-auto-engine
  cancel-in-progress: false

jobs:
  auto-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'httpx>=0.27,<1' 'websockets>=13,<16'
      - name: Run competition maker-first hybrid volume engine
        env:
          LOAF_API_KEY: ${{ secrets.LOAF_API_TOKEN }}
          LOAF_API_BASE_URL: https://api.loafmarkets.com/api
          LOAF_WS_URL: wss://api.loafmarkets.com/ws
          LOAF_TARGET_TOKEN: terafab
          LOAF_ENGINE_SESSION_BUDGET_SECONDS: '240'
          LOAF_ENGINE_MAKER_NOTIONAL: '4500'
          LOAF_ENGINE_MAX_MAKER_SPREAD_PCT: '0.50'
          LOAF_ENGINE_MAKER_REST_SECONDS: '4'
          LOAF_ENGINE_COOLDOWN_SECONDS: '1.0'
          LOAF_ENGINE_MAX_ERRORS: '3'
          LOAF_ENGINE_TARGET_INVENTORY: '20'
          LOAF_ENGINE_INVENTORY_BAND: '5'
          LOAF_ENGINE_MAX_INVENTORY: '50'
          LOAF_ENGINE_MIN_INVENTORY: '0'
          LOAF_ENGINE_WS_STALE_SECONDS: '4'
        run: python league-bot/competition_engine.py
