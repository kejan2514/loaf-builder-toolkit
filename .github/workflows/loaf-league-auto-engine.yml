name: Loaf League Bot - Auto Competition Engine

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * 13-17 8 *'
    - cron: '*/5 0-2 18 8 *'

permissions:
  contents: read

concurrency:
  group: loaf-league-auto-engine
  cancel-in-progress: false

jobs:
  auto-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install 'httpx>=0.27,<1'
      - name: Run Round 1 maker-first hybrid volume engine
        env:
          LOAF_API_KEY: ${{ secrets.LOAF_API_TOKEN }}
          LOAF_API_BASE_URL: https://api.loafmarkets.com/api
          LOAF_TARGET_TOKEN: terafab
          LOAF_ENGINE_ROUND_VOLUME_TARGET: '35000000'
          LOAF_ENGINE_SESSION_BUDGET_SECONDS: '210'
          LOAF_ENGINE_MAKER_NOTIONAL: '3000'
          LOAF_ENGINE_TAKER_NOTIONAL: '1250'
          LOAF_ENGINE_MAX_TAKER_NOTIONAL: '2000'
          LOAF_ENGINE_MAX_MAKER_SPREAD_PCT: '1.0'
          LOAF_ENGINE_MAX_TAKER_SPREAD_PCT: '0.10'
          LOAF_ENGINE_QUOTE_IMPROVEMENT_BPS: '1'
          LOAF_ENGINE_MAKER_REST_SECONDS: '5'
          LOAF_ENGINE_COOLDOWN_SECONDS: '1.5'
          LOAF_ENGINE_MAX_ERRORS: '3'
          LOAF_ENGINE_MAX_EMPTY_BOOKS: '12'
          LOAF_ENGINE_DEPTH_FRACTION: '0.30'
        run: python league-bot/competition_engine.py
