name: Loaf League Bot - Safe API Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'league-bot/**'
      - '.github/workflows/loaf-league-bot-test.yml'

permissions:
  contents: read

jobs:
  connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: pip install 'httpx>=0.27,<1'

      - name: Verify Loaf API authentication and market access
        env:
          LOAF_API_KEY: ${{ secrets.LOAF_API_TOKEN }}
          LOAF_API_BASE: https://api.loafmarkets.com
          LOAF_TOKEN_NAME: terafab
        run: python league-bot/connection_test.py
