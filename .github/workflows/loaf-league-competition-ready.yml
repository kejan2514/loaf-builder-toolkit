name: Loaf League Bot - Competition Ready

on:
  workflow_dispatch:
  schedule:
    # Round 1 starts 2026-08-13 02:00 UTC (05:00 Turkey time).
    # Warm-up checks every 15 minutes during the evening before launch.
    - cron: '*/15 18-23 12 8 *'
    # Closer checks every 5 minutes from 01:00-07:59 UTC on launch day.
    - cron: '*/5 1-7 13 8 *'

permissions:
  contents: read

concurrency:
  group: loaf-competition-ready
  cancel-in-progress: true

jobs:
  competition-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install 'httpx>=0.27,<1'
      - name: Check Terafab competition readiness
        env:
          LOAF_API_KEY: ${{ secrets.LOAF_API_TOKEN }}
          LOAF_API_BASE: https://api.loafmarkets.com
          LOAF_TOKEN_NAME: terafab
        run: python league-bot/competition_ready.py
